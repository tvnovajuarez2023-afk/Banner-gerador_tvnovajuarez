<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Banners - tvnovajuarez</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0b0b;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #f5c842;
            text-transform: uppercase;
            border-bottom: 2px solid #f5c842;
            padding-bottom: 12px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 small {
            font-size: 14px;
            color: #aaa;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
            margin-left: auto;
        }
        .search-area {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .search-area input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            border: none;
            border-radius: 40px;
            background: #2a2a2a;
            color: #fff;
            font-size: 16px;
            outline: 1px solid #444;
            transition: 0.2s;
        }
        .search-area input[type="text"]:focus {
            outline-color: #f5c842;
        }
        .search-area button {
            padding: 14px 28px;
            border: none;
            border-radius: 40px;
            background: #f5c842;
            color: #111;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .search-area button:hover {
            background: #e0b031;
            transform: scale(1.02);
        }
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
            max-height: 320px;
            overflow-y: auto;
            padding: 5px;
        }
        .result-item {
            background: #252525;
            border-radius: 16px;
            padding: 12px;
            cursor: pointer;
            transition: 0.15s;
            text-align: center;
            border: 2px solid transparent;
        }
        .result-item:hover {
            border-color: #f5c842;
            background: #2e2e2e;
        }
        .result-item img {
            width: 100%;
            border-radius: 10px;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: #333;
        }
        .result-item .title {
            margin-top: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #eee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .result-item .year {
            font-size: 12px;
            color: #aaa;
        }
        .banner-preview {
            background: #111;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .banner-preview canvas {
            width: 100%;
            max-width: 700px;
            height: auto;
            aspect-ratio: 16/9;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.9);
            background: #0a0a0a;
        }
        /* GRID DE CONTROLES: 3 colunas, 2 linhas */
        .controls-grid {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px 20px;
            width: 100%;
            max-width: 800px;
        }
        .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: stretch;
        }
        .control-item label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        .control-item .row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .control-item .row input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 30px;
            background: #2a2a2a;
            color: #fff;
            font-size: 13px;
            outline: 1px solid #444;
            min-width: 0;
        }
        .control-item .row input[type="text"]:focus {
            outline-color: #f5c842;
        }
        .control-item .row button {
            padding: 8px 14px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .control-item .row button:hover {
            transform: scale(1.03);
        }
        .btn-whatsapp {
            background: #25d366;
            color: #fff;
        }
        .btn-whatsapp:hover {
            background: #1da85a;
        }
        .btn-logo {
            background: #6c63ff;
            color: #fff;
        }
        .btn-logo:hover {
            background: #5a52d5;
        }
        .btn-mosaico {
            background: #ff6584;
            color: #fff;
        }
        .btn-mosaico:hover {
            background: #e05a75;
        }
        .btn-mosaico.active {
            background: #ffd700;
            color: #111;
        }
        .btn-fundo {
            background: #00bcd4;
            color: #fff;
        }
        .btn-fundo:hover {
            background: #0097a7;
        }
        .btn-fundo.active {
            background: #ffd700;
            color: #111;
        }
        .btn-msg {
            background: #00bcd4;
            color: #fff;
        }
        .btn-msg:hover {
            background: #0097a7;
        }
        .btn-msg.limpar {
            background: #ff5252;
        }
        .btn-msg.limpar:hover {
            background: #d32f2f;
        }
        .btn-download {
            background: #f5c842;
            color: #111;
            font-weight: 700;
            padding: 10px 30px;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            justify-self: center;
            grid-column: 1 / -1;
            margin-top: 6px;
        }
        .btn-download:hover {
            background: #e0b031;
            transform: scale(1.02);
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .status-text {
            font-size: 11px;
            color: #888;
            padding-left: 4px;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        .results::-webkit-scrollbar {
            width: 6px;
        }
        .results::-webkit-scrollbar-thumb {
            background: #f5c842;
            border-radius: 10px;
        }
        /* Responsivo */
        @media (max-width: 700px) {
            .controls-grid {
                grid-template-columns: 1fr 1fr;
            }
            .btn-download {
                grid-column: 1 / -1;
            }
        }
        @media (max-width: 480px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            🎬 Gerador de Banners
            <small>tvnovajuarez</small>
        </h1>

        <!-- Busca -->
        <div class="search-area">
            <input type="text" id="searchInput" placeholder="Digite o nome do filme ou série..." />
            <button id="searchBtn">🔍 Buscar</button>
        </div>

        <!-- Resultados da busca -->
        <div id="resultsContainer" class="results"></div>

        <!-- Pré-visualização do banner -->
        <div class="banner-preview">
            <canvas id="bannerCanvas" width="1200" height="675"></canvas>

            <!-- Controles em grade 3x2 -->
            <div class="controls-grid">
                <!-- Coluna 1: WhatsApp -->
                <div class="control-item">
                    <label>WhatsApp</label>
                    <div class="row">
                        <input type="text" id="whatsappInput" placeholder="(11) 99999-9999" />
                        <button class="btn-whatsapp" id="addWhatsappBtn">Adicionar</button>
                    </div>
                </div>

                <!-- Coluna 2: Logo -->
                <div class="control-item">
                    <label>Logo</label>
                    <div class="row">
                        <button class="btn-logo" id="loadLogoBtn">🖼️ Carregar</button>
                        <span class="status-text" id="logoStatus">Nenhuma</span>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" style="display:none;" />
                </div>

                <!-- Coluna 3: Mosaico -->
                <div class="control-item">
                    <label>Mosaico</label>
                    <div class="row">
                        <button class="btn-mosaico" id="toggleMosaicoBtn">🔲 Ativar</button>
                        <span class="status-text" id="mosaicoStatus">Desativado</span>
                    </div>
                </div>

                <!-- Coluna 1 (linha 2): Fundo Imagem -->
                <div class="control-item">
                    <label>Fundo Imagem</label>
                    <div class="row">
                        <button class="btn-fundo" id="toggleFundoBtn">🌄 Ativar</button>
                        <span class="status-text" id="fundoStatus">Desativado</span>
                    </div>
                </div>

                <!-- Coluna 2 (linha 2): (vazio) -->
                <div class="control-item">
                    <label>&nbsp;</label>
                    <div class="row">
                        <!-- Espaço reservado -->
                    </div>
                </div>

                <!-- Coluna 3 (linha 2): Mensagem Personalizada -->
                <div class="control-item">
                    <label>Mensagem</label>
                    <div class="row">
                        <input type="text" id="msgInput" placeholder="Digite sua mensagem..." />
                        <button class="btn-msg" id="addMsgBtn">Adicionar</button>
                        <button class="btn-msg limpar" id="clearMsgBtn" style="display:none;">✕</button>
                    </div>
                </div>

                <!-- Botão Download ocupa toda a largura -->
                <button class="btn-download" id="downloadBtn">⬇️ Baixar Banner</button>
            </div>
        </div>
        <div class="footer">Banner gerado com dados do TVmaze • Logo com fundo removido • Mosaico • Fundo com imagem • Mensagem personalizada</div>
    </div>

    <script>
        // ============================================================
        //   ELEMENTOS DO DOM
        // ============================================================
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const canvas = document.getElementById('bannerCanvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');
        const whatsappInput = document.getElementById('whatsappInput');
        const addWhatsappBtn = document.getElementById('addWhatsappBtn');
        const loadLogoBtn = document.getElementById('loadLogoBtn');
        const fileInput = document.getElementById('fileInput');
        const toggleMosaicoBtn = document.getElementById('toggleMosaicoBtn');
        const toggleFundoBtn = document.getElementById('toggleFundoBtn');
        const msgInput = document.getElementById('msgInput');
        const addMsgBtn = document.getElementById('addMsgBtn');
        const clearMsgBtn = document.getElementById('clearMsgBtn');
        const logoStatus = document.getElementById('logoStatus');
        const mosaicoStatus = document.getElementById('mosaicoStatus');
        const fundoStatus = document.getElementById('fundoStatus');

        // ============================================================
        //   DADOS DO BANNER
        // ============================================================
        let bannerData = {
            title: 'Título do Filme',
            year: '2024',
            genres: ['Ação', 'Aventura'],
            summary: 'Sinopse do filme...',
            imageUrl: null,
            image: null,
            whatsapp: '',
            logoImage: null,
            logoLoaded: false,
            mosaicoAtivo: false,
            fundoImagemAtivo: false,
            mensagemPersonalizada: null
        };

        // ============================================================
        //   FUNÇÕES AUXILIARES
        // ============================================================
        function limparResultados() {
            resultsContainer.innerHTML = '';
        }

        function exibirResultados(shows) {
            limparResultados();
            if (!shows || shows.length === 0) {
                resultsContainer.innerHTML = '<p style="color:#999; text-align:center; grid-column:1/-1;">Nenhum resultado encontrado.</p>';
                return;
            }
            shows.forEach(show => {
                const item = document.createElement('div');
                item.className = 'result-item';
                const imgUrl = show.image?.medium || show.image?.original || 'https://via.placeholder.com/210x295/333/666?text=Sem+Imagem';
                item.innerHTML = `
                    <img src="${imgUrl}" alt="${show.name}" />
                    <div class="title">${show.name}</div>
                    <div class="year">${show.premiered ? show.premiered.split('-')[0] : 'N/A'}</div>
                `;
                item.addEventListener('click', () => selecionarShow(show));
                resultsContainer.appendChild(item);
            });
        }

        // ============================================================
        //   BUSCA NA API TVMAZE
        // ============================================================
        async function buscarShows(query) {
            if (!query.trim()) return [];
            try {
                const response = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query)}`);
                if (!response.ok) throw new Error('Erro na API');
                const data = await response.json();
                return data.map(item => item.show).filter(show => show.image);
            } catch (error) {
                console.error(error);
                alert('Erro ao buscar. Tente novamente.');
                return [];
            }
        }

        // ============================================================
        //   SELECIONAR UM SHOW
        // ============================================================
        function selecionarShow(show) {
            bannerData.title = show.name || 'Título';
            bannerData.year = show.premiered ? show.premiered.split('-')[0] : 'Ano';
            bannerData.genres = show.genres && show.genres.length ? show.genres : ['Gênero'];
            bannerData.summary = show.summary ? show.summary.replace(/<[^>]*>/g, '') : 'Sinopse não disponível.';
            bannerData.imageUrl = show.image?.original || show.image?.medium || null;

            if (bannerData.imageUrl) {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    bannerData.image = img;
                    desenharBanner();
                };
                img.onerror = () => {
                    bannerData.image = null;
                    desenharBanner();
                };
                img.src = bannerData.imageUrl;
            } else {
                bannerData.image = null;
                desenharBanner();
            }
        }

        // ============================================================
        //   REMOÇÃO DE FUNDO DA LOGO
        // ============================================================
        function removerFundo(image, threshold = 30) {
            const offscreen = document.createElement('canvas');
            offscreen.width = image.width;
            offscreen.height = image.height;
            const offCtx = offscreen.getContext('2d');
            offCtx.drawImage(image, 0, 0);

            const imageData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
            const data = imageData.data;
            const refR = data[0];
            const refG = data[1];
            const refB = data[2];

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const dist = Math.sqrt((r - refR) ** 2 + (g - refG) ** 2 + (b - refB) ** 2);
                if (dist < threshold) {
                    data[i + 3] = 0;
                }
            }
            offCtx.putImageData(imageData, 0, 0);
            return offscreen;
        }

        // ============================================================
        //   CARREGAR LOGO
        // ============================================================
        function carregarLogo(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvasSemFundo = removerFundo(img);
                    const logoImg = new Image();
                    logoImg.onload = () => {
                        bannerData.logoImage = logoImg;
                        bannerData.logoLoaded = true;
                        logoStatus.textContent = 'Carregada ✓';
                        logoStatus.style.color = '#6c63ff';
                        desenharBanner();
                    };
                    logoImg.src = canvasSemFundo.toDataURL('image/png');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ============================================================
        //   DESENHAR O BANNER
        // ============================================================
        function desenharBanner() {
            const w = canvas.width;
            const h = canvas.height;

            // --- FUNDO: gradiente ou imagem ---
            if (bannerData.fundoImagemAtivo && bannerData.image) {
                // Desenha a imagem esticada com opacidade e desfoque
                ctx.save();
                // Aplicar desfoque (blur) no canvas
                ctx.filter = 'blur(10px)';
                ctx.globalAlpha = 0.4;
                ctx.drawImage(bannerData.image, 0, 0, w, h);
                ctx.restore();
                // Sobrepor um tom escuro para melhor legibilidade
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(0, 0, w, h);
            } else {
                // Gradiente padrão
                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, '#1a1a2e');
                grad.addColorStop(0.5, '#16213e');
                grad.addColorStop(1, '#0f0f1f');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
            }

            // --- MOSAICO (opcional, sobre o fundo) ---
            if (bannerData.mosaicoAtivo && bannerData.logoLoaded && bannerData.logoImage) {
                const logo = bannerData.logoImage;
                const baseSize = 70;
                const spacingX = 100;
                const spacingY = 100;
                const cols = Math.ceil(w / spacingX) + 2;
                const rows = Math.ceil(h / spacingY) + 2;

                ctx.save();
                ctx.globalAlpha = 0.25;
                for (let i = 0; i < cols; i++) {
                    for (let j = 0; j < rows; j++) {
                        const x = i * spacingX - 30;
                        const y = j * spacingY - 30;
                        const scale = 0.6 + Math.random() * 0.6;
                        const size = baseSize * scale;
                        const ratio = logo.width / logo.height;
                        let drawW = size;
                        let drawH = size / ratio;
                        if (drawH > size) {
                            drawH = size;
                            drawW = size * ratio;
                        }
                        ctx.drawImage(logo, x, y, drawW, drawH);
                    }
                }
                ctx.restore();
            }

            // --- Borda dourada ---
            ctx.strokeStyle = '#f5c842';
            ctx.lineWidth = 6;
            ctx.strokeRect(10, 10, w - 20, h - 20);

            // --- LOGO OFICIAL (canto superior esquerdo) ---
            if (bannerData.logoLoaded && bannerData.logoImage) {
                const logo = bannerData.logoImage;
                const maxH = 80;
                const ratio = logo.width / logo.height;
                let drawW, drawH;
                if (logo.height > maxH) {
                    drawH = maxH;
                    drawW = maxH * ratio;
                } else {
                    drawW = logo.width;
                    drawH = logo.height;
                }
                const x = 30;
                const y = 20;
                ctx.shadowColor = 'rgba(0,0,0,0.7)';
                ctx.shadowBlur = 12;
                ctx.drawImage(logo, x, y, drawW, drawH);
                ctx.shadowBlur = 0;
            } else {
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.7)';
                ctx.shadowBlur = 16;
                ctx.font = 'bold 44px "Segoe UI", Arial, sans-serif';
                ctx.fillStyle = '#f5c842';
                ctx.fillText('📺 tvnovajuarez', 30, 70);
                ctx.restore();
                ctx.strokeStyle = '#f5c842';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(30, 80);
                ctx.lineTo(330, 80);
                ctx.stroke();
            }

            // --- IMAGEM DO SHOW (lado direito) ---
            if (bannerData.image) {
                const imgW = 380;
                const imgH = 540;
                const x = w - imgW - 40;
                const y = (h - imgH) / 2;

                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.shadowBlur = 30;
                ctx.drawImage(bannerData.image, x, y, imgW, imgH);
                ctx.shadowBlur = 0;

                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, imgW, imgH);
            } else {
                ctx.fillStyle = '#333';
                ctx.fillRect(w - 420, 40, 380, 540);
                ctx.fillStyle = '#666';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Sem imagem', w - 230, 300);
                ctx.textAlign = 'left';
            }

            // --- TÍTULO ---
            const titleX = 50;
            const titleY = 130;
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 20;
            ctx.font = 'bold 64px "Segoe UI", Arial, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';

            let titulo = bannerData.title || 'Título';
            if (titulo.length > 25) titulo = titulo.substring(0, 24) + '…';
            ctx.fillText(titulo, titleX, titleY);

            // --- ANO E GÊNEROS ---
            ctx.shadowBlur = 10;
            ctx.font = '28px "Segoe UI", Arial, sans-serif';
            ctx.fillStyle = '#f5c842';
            const yearText = bannerData.year || 'Ano';
            const genresText = bannerData.genres && bannerData.genres.length ? bannerData.genres.join(' • ') : 'Gênero';
            ctx.fillText(`${yearText}  •  ${genresText}`, titleX, titleY + 60);

            // --- SINOPSE ou MENSAGEM PERSONALIZADA ---
            ctx.shadowBlur = 8;
            ctx.font = '22px "Segoe UI", Arial, sans-serif';
            ctx.fillStyle = '#cccccc';
            let textoExibicao = bannerData.mensagemPersonalizada || bannerData.summary || 'Sinopse não disponível.';
            if (bannerData.mensagemPersonalizada) {
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 26px "Segoe UI", Arial, sans-serif';
            }
            if (textoExibicao.length > 180) textoExibicao = textoExibicao.substring(0, 177) + '…';
            const maxWidth = 600;
            const lines = quebrarTexto(ctx, textoExibicao, maxWidth);
            let lineY = titleY + 120;
            lines.forEach(line => {
                ctx.fillText(line, titleX, lineY);
                lineY += 34;
            });

            // --- WHATSAPP ---
            if (bannerData.whatsapp) {
                ctx.shadowBlur = 20;
                ctx.font = 'bold 32px "Segoe UI", Arial, sans-serif';
                ctx.fillStyle = '#25d366';
                ctx.textAlign = 'left';
                ctx.fillText(`📱 ${bannerData.whatsapp}`, 50, h - 60);
                ctx.font = '18px Arial';
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fillText('Contato via WhatsApp', 50, h - 30);
            }

            // Linha decorativa inferior
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#f5c842';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(50, h - 90);
            ctx.lineTo(350, h - 90);
            ctx.stroke();

            // Rodapé
            ctx.font = '16px Arial';
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.textAlign = 'right';
            ctx.fillText('Gerado por tvnovajuarez', w - 40, h - 25);
            ctx.textAlign = 'left';
        }

        function quebrarTexto(ctx, texto, maxWidth) {
            const words = texto.split(' ');
            let lines = [];
            let currentLine = '';
            for (let word of words) {
                const testLine = currentLine + word + ' ';
                if (ctx.measureText(testLine).width < maxWidth) {
                    currentLine = testLine;
                } else {
                    lines.push(currentLine.trim());
                    currentLine = word + ' ';
                }
            }
            if (currentLine.trim()) lines.push(currentLine.trim());
            return lines;
        }

        // ============================================================
        //   WHATSAPP
        // ============================================================
        function adicionarWhatsapp() {
            const numero = whatsappInput.value.trim();
            if (!numero) {
                alert('Digite um número de WhatsApp.');
                return;
            }
            bannerData.whatsapp = numero;
            desenharBanner();
            whatsappInput.value = '';
        }

        // ============================================================
        //   MOSAICO
        // ============================================================
        function toggleMosaico() {
            bannerData.mosaicoAtivo = !bannerData.mosaicoAtivo;
            toggleMosaicoBtn.classList.toggle('active', bannerData.mosaicoAtivo);
            toggleMosaicoBtn.textContent = bannerData.mosaicoAtivo ? '✅ Ativo' : '🔲 Ativar';
            mosaicoStatus.textContent = bannerData.mosaicoAtivo ? 'Ativado' : 'Desativado';
            mosaicoStatus.style.color = bannerData.mosaicoAtivo ? '#ffd700' : '#888';
            desenharBanner();
        }

        // ============================================================
        //   FUNDO IMAGEM
        // ============================================================
        function toggleFundo() {
            bannerData.fundoImagemAtivo = !bannerData.fundoImagemAtivo;
            toggleFundoBtn.classList.toggle('active', bannerData.fundoImagemAtivo);
            toggleFundoBtn.textContent = bannerData.fundoImagemAtivo ? '✅ Ativo' : '🌄 Ativar';
            fundoStatus.textContent = bannerData.fundoImagemAtivo ? 'Ativado' : 'Desativado';
            fundoStatus.style.color = bannerData.fundoImagemAtivo ? '#ffd700' : '#888';
            desenharBanner();
        }

        // ============================================================
        //   MENSAGEM PERSONALIZADA
        // ============================================================
        function adicionarMensagem() {
            const texto = msgInput.value.trim();
            if (!texto) {
                alert('Digite uma mensagem.');
                return;
            }
            bannerData.mensagemPersonalizada = texto;
            addMsgBtn.textContent = 'Alterar';
            clearMsgBtn.style.display = 'inline-block';
            desenharBanner();
            msgInput.value = '';
        }

        function limparMensagem() {
            bannerData.mensagemPersonalizada = null;
            addMsgBtn.textContent = 'Adicionar';
            clearMsgBtn.style.display = 'none';
            desenharBanner();
        }

        // ============================================================
        //   DOWNLOAD
        // ============================================================
        function baixarBanner() {
            const link = document.createElement('a');
            link.download = `banner-${bannerData.title.replace(/\s+/g, '-')}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // ============================================================
        //   EVENTOS
        // ============================================================
        searchBtn.addEventListener('click', async () => {
            const query = searchInput.value.trim();
            if (!query) return;
            const shows = await buscarShows(query);
            exibirResultados(shows);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchBtn.click();
        });

        addWhatsappBtn.addEventListener('click', adicionarWhatsapp);
        downloadBtn.addEventListener('click', baixarBanner);

        loadLogoBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                carregarLogo(e.target.files[0]);
                fileInput.value = '';
            }
        });

        toggleMosaicoBtn.addEventListener('click', toggleMosaico);
        toggleFundoBtn.addEventListener('click', toggleFundo);

        addMsgBtn.addEventListener('click', adicionarMensagem);
        clearMsgBtn.addEventListener('click', limparMensagem);

        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') adicionarMensagem();
        });

        // ============================================================
        //   INICIALIZAR COM EXEMPLO
        // ============================================================
        (function init() {
            bannerData.title = 'Rambo - Programado Para Matar';
            bannerData.year = '1982';
            bannerData.genres = ['Ação', 'Aventura'];
            bannerData.summary = 'Um veterano da Guerra do Vietnã, John Rambo, enfrenta uma perseguição implacável enquanto tenta encontrar seu caminho em uma sociedade que o rejeita.';
            bannerData.imageUrl = 'https://m.media-amazon.com/images/I/71k7Lx3B6fL._AC_UF894,1000_QL80_.jpg';
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = () => {
                bannerData.image = img;
                desenharBanner();
            };
            img.onerror = () => {
                bannerData.image = null;
                desenharBanner();
            };
            img.src = bannerData.imageUrl;
        })();
    </script>
</body>
</html>
